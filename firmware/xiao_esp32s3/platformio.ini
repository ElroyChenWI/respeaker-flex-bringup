; reSpeaker Flex XVF3800 + XIAO ESP32S3 bring-up firmware
; Build:  ..\..\scripts\pio.ps1 run
; Flash:  ..\..\scripts\pio.ps1 run -t upload   (先跑 scripts\backup_xiao_flash.ps1 備份出廠韌體)

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; HW USB-Serial/JTAG (303A:1001). 開 port 時不要拉 DTR/RTS，避免 auto-reset。
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; GPIO43 = UART0 TX 也是 I2S DIN，關掉 core log 避免干擾
    -DCORE_DEBUG_LEVEL=0
    -DEVK_FW_VERSION=\"0.1.0\"
